<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Discover Events | EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=13">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/ui">EventSphere</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#eventsNavbar" aria-controls="eventsNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="eventsNavbar">
            <div class="navbar-nav ms-lg-auto align-items-lg-center">
                <a class="nav-link active" href="/ui/events">Events</a>
                <a id="eventsMyBookings" class="nav-link d-none" href="/ui/my-bookings">My Bookings</a>
                <a id="eventsMyTickets" class="nav-link d-none" href="/ui/my-tickets">My Tickets</a>
                <a id="eventsProfile" class="nav-link d-none" href="/ui/profile">Profile</a>
                <a id="eventsLogin" class="nav-link" href="/ui/login">Login</a>
                <a id="eventsRegister" class="nav-link" href="/ui/register">Register</a>
                <button id="eventsLogout" class="btn btn-outline-light btn-sm d-none" type="button">Logout</button>
            </div>
        </div>
    </div>
</nav>

<main class="container py-5">
    <a class="back-link" href="/ui"><i class="bi bi-arrow-left"></i> Back to Home</a>

    <div class="text-center mb-5">
        <h1 class="fw-bold">Discover Events</h1>
        <p class="text-muted">Find and explore exciting events around you.</p>
    </div>

    <div class="row mb-4">
        <div class="col-md-8 mb-2">
            <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search events by title..."
            >
        </div>

        <div class="col-md-4 mb-2">
            <select id="categoryFilter" class="form-select">
                <option value="">All Categories</option>
            </select>
        </div>
    </div>

    <div id="eventCount" class="text-muted mb-3"></div>

    <div id="loading" class="text-center py-5">
        Loading events...
    </div>

    <div id="eventList" class="row g-4"></div>

    <div id="noEvents" class="text-center py-5 d-none">
        <h4>No events found</h4>
        <p class="text-muted">Try another search or category.</p>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/auth-session.js?v=1"></script>
<script>
const eventsUser = EventSphereAuth.getUser();
const eventsToken = EventSphereAuth.getToken();
if (eventsToken && eventsUser) {
    document.getElementById("eventsLogin").classList.add("d-none");
    document.getElementById("eventsRegister").classList.add("d-none");
    document.getElementById("eventsLogout").classList.remove("d-none");
    document.getElementById("eventsMyBookings").classList.remove("d-none");
    document.getElementById("eventsMyTickets").classList.remove("d-none");
    document.getElementById("eventsProfile").classList.remove("d-none");
}
document.getElementById("eventsLogout").addEventListener("click", () => {
    EventSphereAuth.clearSession();
    window.location.href = "/ui/login";
});
</script>
<script src="/static/js/events.js?v=2"></script>
</body>
</html>
