<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR Scanner | EventSphere Gate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=18">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark gate-navbar">
    <div class="container">
        <a class="navbar-brand" href="/ui/gate/dashboard">EventSphere Gate</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#gateNavbar" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="gateNavbar">
            <div class="navbar-nav ms-lg-auto align-items-lg-center gap-1">
                <a class="nav-link" href="/ui/gate/dashboard">Dashboard</a>
                <a class="nav-link active" href="/ui/gate/scanner">Scan QR</a>
                <a class="nav-link" href="/ui/gate/history">History</a>
                <a class="nav-link" href="/ui/gate/events">Events</a>
                <a class="nav-link" href="/ui/gate/profile">Profile</a>
                <button id="gateLogout" class="btn btn-danger btn-sm ms-lg-2" type="button">Logout</button>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4 gate-shell">
    <a href="/ui/gate/dashboard" class="back-link"><i class="bi bi-arrow-left"></i>Back to Dashboard</a>
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm gate-scanner-card">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <span class="section-kicker">Ticket validation</span>
                        <h1 class="h2 mb-2">Scan or Enter Ticket QR</h1>
                        <p class="text-muted mb-0">Camera access is optional. Manual validation is always available.</p>
                    </div>

                    <div id="cameraPermission" class="alert alert-warning d-none" role="alert"></div>
                    <div id="reader" class="gate-reader mb-3"></div>
                    <div class="d-flex gap-2 mb-4">
                        <button id="startScanner" class="btn btn-primary flex-grow-1" type="button"><i class="bi bi-camera me-1"></i>Start Scanner</button>
                        <button id="stopScanner" class="btn btn-outline-secondary flex-grow-1" type="button" disabled><i class="bi bi-stop-circle me-1"></i>Stop Scanner</button>
                    </div>

                    <div class="gate-manual-entry">
                        <label for="manualQr" class="form-label">Manual QR value or Ticket ID</label>
                        <div class="input-group">
                            <input id="manualQr" type="text" class="form-control" placeholder="Enter QR token or ticket ID" autocomplete="off">
                            <button id="validateTicket" class="btn btn-success" type="button">Validate</button>
                        </div>
                        <small class="text-muted">Ticket ID support requires entering an existing numeric ID.</small>
                    </div>

                    <div id="scannerLoading" class="gate-validation-loading d-none">
                        <span class="spinner-border spinner-border-sm me-2"></span>Validating ticket...
                    </div>
                    <div id="scanResult" class="gate-result d-none" role="status"></div>
                    <button id="confirmCheckIn" class="btn btn-success w-100 d-none" type="button">Confirm Check-in</button>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/static/js/gate-scanner.js?v=1"></script>
</body>
</html>
