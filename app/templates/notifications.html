<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications | EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=7">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/ui">EventSphere</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#notificationNavbar" aria-controls="notificationNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="notificationNavbar">
            <div class="navbar-nav ms-lg-auto align-items-lg-center">
                <a class="nav-link" href="/ui/events">Browse Events</a>
                <a class="nav-link" href="/ui/my-bookings">My Bookings</a>
                <a class="nav-link" href="/ui/my-tickets">My Tickets</a>
                <a class="nav-link" href="/ui/my-waitlist">My Waitlist</a>
                <a class="nav-link active" href="/ui/notifications">Notifications</a>
                <button class="btn btn-outline-light btn-sm ms-lg-2" id="logoutButton">Logout</button>
            </div>
        </div>
    </div>
</nav>
<main class="container py-5">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb page-breadcrumb">
            <li class="breadcrumb-item"><a href="/ui">Attendee Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page">Notifications</li>
        </ol>
    </nav>
    <a class="back-link" href="/ui"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
    <h1 class="h2 mt-2 mb-1">Notifications</h1>
    <p id="notificationSummary" class="text-muted">Loading notifications...</p>
    <div id="pageMessage" class="alert d-none" role="alert"></div>
    <div id="notificationList" class="list-group"></div>
    <div id="emptyState" class="alert alert-light d-none">
        You have no notifications.
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/notifications.js"></script>
</body>
</html>
