
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Venues | EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/ui">EventSphere</a>
        <div>
            <a href="/ui/admin" class="btn btn-outline-light btn-sm">Dashboard</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Manage Venues</h2>
            <p class="text-muted">Add and manage university event venues.</p>
        </div>
        <button class="btn btn-primary" onclick="openAddForm()">+ Add Venue</button>
    </div>

    <div id="message" class="alert d-none"></div>

    <div class="card shadow-sm mb-4" id="venueFormCard" style="display:none;">
        <div class="card-body">
            <h5 id="formTitle">Add New Venue</h5>
            <form id="venueForm">
                <input type="hidden" id="venueId">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Venue Name</label>
                        <input class="form-control" id="venueName" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Location</label>
                        <input class="form-control" id="venueLocation" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Capacity</label>
                        <input type="number" class="form-control" id="venueCapacity" min="1" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Hourly Rate (LKR)</label>
                        <input type="number" class="form-control" id="venueRate" min="0" step="0.01" value="0" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Private Hire</label>
                        <select class="form-select" id="privateHire">
                            <option value="true">Available</option>
                            <option value="false">Not Available</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="venueDescription" rows="3"></textarea>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-success" id="saveButton">Save Venue</button>
                    <button type="button" class="btn btn-secondary" onclick="closeForm()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="mb-3">Available Venues</h5>
            <div id="loading" class="text-center py-3">Loading venues...</div>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Location</th>
                            <th>Capacity</th>
                            <th>Hourly Rate</th>
                            <th>Private Hire</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="venueTable"></tbody>
                </table>
            </div>
            <p id="emptyMessage" class="text-center text-muted d-none">No venues found.</p>
        </div>
    </div>
</div>

<script src="/static/js/venues-manage.js"></script>
</body>
</html>
