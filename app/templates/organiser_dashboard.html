<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Organiser Dashboard | EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=18">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/ui/organiser/dashboard">EventSphere Organiser</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#organiserNavbar"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="organiserNavbar">
            <div class="navbar-nav ms-lg-auto align-items-lg-center gap-1">
                <a class="nav-link active" href="/ui/organiser/dashboard"><i class="bi bi-speedometer2"></i>Dashboard</a>
                <a class="nav-link" href="/ui/manage-events"><i class="bi bi-calendar-event"></i>Events</a>
                <a class="nav-link" href="/ui/manage-venues"><i class="bi bi-building"></i>Venues</a>
                <button id="organiserLogout" class="btn btn-danger btn-sm ms-lg-2" type="button">Logout</button>
            </div>
        </div>
    </div>
</nav>
<main class="container py-4 organiser-shell">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
            <span class="section-kicker">Organiser workspace</span>
            <h1 class="h2 mb-1">Organiser Dashboard</h1>
            <p id="organiserWelcome" class="text-muted mb-0">Your event and booking overview</p>
        </div>
        <a href="/ui/manage-events" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Manage Events</a>
    </div>
    <div id="organiserError" class="alert alert-danger d-none"></div>
    <div class="row g-3 mb-4">
        <div class="col-6 col-xl-3"><div class="card stat-card h-100"><div class="card-body"><span class="stat-icon"><i class="bi bi-calendar2-event"></i></span><p class="text-muted mb-1">Total Events</p><h3 id="organiserTotalEvents" class="mb-0">-</h3></div></div></div>
        <div class="col-6 col-xl-3"><div class="card stat-card h-100"><div class="card-body"><span class="stat-icon"><i class="bi bi-broadcast"></i></span><p class="text-muted mb-1">Published</p><h3 id="organiserPublishedEvents" class="mb-0">-</h3></div></div></div>
        <div class="col-6 col-xl-3"><div class="card stat-card h-100"><div class="card-body"><span class="stat-icon"><i class="bi bi-ticket-perforated"></i></span><p class="text-muted mb-1">Tickets Sold</p><h3 id="organiserTicketsSold" class="mb-0">-</h3></div></div></div>
        <div class="col-6 col-xl-3"><div class="card stat-card h-100"><div class="card-body"><span class="stat-icon"><i class="bi bi-currency-dollar"></i></span><p class="text-muted mb-1">Simulated Revenue</p><h3 id="organiserRevenue" class="mb-0">-</h3></div></div></div>
    </div>
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-5"><label class="form-label" for="organiserEventFilter">Filter by event</label><select id="organiserEventFilter" class="form-select"><option value="">All own events</option></select></div>
                <div class="col-md-3"><label class="form-label" for="organiserStatusFilter">Booking status</label><select id="organiserStatusFilter" class="form-select"><option value="">All statuses</option><option value="PENDING">Pending</option><option value="CONFIRMED">Confirmed</option><option value="CANCELLED">Cancelled</option></select></div>
                <div class="col-md-4 d-grid"><button id="organiserRefresh" class="btn btn-outline-primary" type="button"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button></div>
            </div>
        </div>
    </div>
    <div class="card shadow-sm">
        <div class="card-body border-bottom"><h2 class="h5 mb-0">Recent Booking Activity</h2></div>
        <div class="table-responsive"><table class="table table-hover align-middle mb-0 organiser-booking-table">
            <thead><tr><th>Booking</th><th>Event</th><th>Attendee</th><th>Quantity</th><th>Amount</th><th>Payment</th><th>Status</th></tr></thead>
            <tbody id="organiserBookings"><tr><td colspan="7" class="text-center py-4">Loading bookings...</td></tr></tbody>
        </table></div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/organiser-dashboard.js?v=1"></script>
</body>
</html>
