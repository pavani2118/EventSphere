<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event Details | EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/ui">EventSphere</a>
        <div>
            <a href="/ui/events" class="btn btn-outline-light btn-sm">All Events</a>
        </div>
    </div>
</nav>

<main class="container py-5">

    <a href="/ui/events" class="text-decoration-none">
        &larr; Back to Events
    </a>

    <div id="loading" class="text-center py-5">
        Loading event details...
    </div>

    <div id="eventContent" class="d-none">

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <span id="eventCategory" class="badge bg-primary mb-3"></span>
                <h1 id="eventTitle" class="fw-bold"></h1>

                <p id="eventDescription" class="text-muted"></p>

                <hr>

                <p><strong>Venue:</strong> <span id="venueName"></span></p>
                <p><strong>Location:</strong> <span id="venueLocation"></span></p>
                <p><strong>Starts:</strong> <span id="startTime"></span></p>
                <p><strong>Ends:</strong> <span id="endTime"></span></p>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <h3 class="fw-bold mb-3">Book Your Tickets</h3>

                <div id="bookingMessage" class="alert d-none"></div>

                <div class="mb-3">
                    <label for="ticketCategory" class="form-label">
                        Select Ticket Category
                    </label>

                    <select id="ticketCategory" class="form-select" required>
                        <option value="">Choose a ticket category</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="ticketQuantity" class="form-label">
                        Number of Tickets
                    </label>

                    <input
                        type="number"
                        id="ticketQuantity"
                        class="form-control"
                        min="1"
                        max="10"
                        value="1"
                    >

                    <small class="text-muted">
                        Maximum 10 tickets per booking.
                    </small>
                </div>

                <div class="bg-light rounded p-3 mb-3">
                    <p class="mb-1">
                        Ticket Price:
                        <strong id="ticketPrice">LKR 0.00</strong>
                    </p>

                    <p class="mb-0 fs-5">
                        Total Amount:
                        <strong id="totalPrice">LKR 0.00</strong>
                    </p>
                </div>

                <button id="bookButton" class="btn btn-primary w-100">
                    Book Tickets
                </button>

                <p class="text-muted small mt-3 mb-0">
                    Payment is simulated for this academic project.
                </p>

            </div>
        </div>

    </div>

</main>

<script src="/static/js/event-details.js"></script>
</body>
</html>
