<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=5">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/ui">EventSphere</a>
        <a class="btn btn-outline-light btn-sm" href="/ui/login">Login</a>
    </div>
</nav>

<main class="container auth-container">
    <div class="card auth-card shadow-sm">
        <div class="card-body p-4">
            <div class="text-center mb-1">
                <span class="badge bg-primary mb-2">EventSphere</span>
            </div>
            <h2 class="fw-bold mb-2">Create an account</h2>
            <p class="text-muted mb-4">Join EventSphere and discover events.</p>

            <div id="message" class="alert d-none" role="alert"></div>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="full_name" class="form-label">Full name</label>
                    <input type="text" class="form-control" id="full_name"
                           required minlength="2" autocomplete="name">
                </div>

                <div class="mb-3">
                    <label for="register_email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="register_email"
                           required autocomplete="email">
                </div>

                <div class="mb-3">
                    <label for="register_password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="register_password"
                           required minlength="8" autocomplete="new-password">
                    <small class="text-muted">Use at least 8 characters.</small>
                </div>

                <button type="submit" id="registerButton"
                        class="btn btn-primary w-100">
                    Create account
                </button>
            </form>

            <p class="text-center mt-4 mb-0">
                Already have an account?
                <a href="/ui/login">Login here</a>
            </p>
        </div>
    </div>
</main>

<script src="/static/js/app.js"></script>
</body>
</html>
