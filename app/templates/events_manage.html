
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Events | EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=11">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/ui/admin">EventSphere Admin</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNavbar">
            <div class="navbar-nav ms-lg-auto align-items-lg-center gap-lg-1">
                <a class="nav-link" href="/ui/admin"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a class="nav-link" href="/ui/manage-venues"><i class="bi bi-building"></i> Manage Venues</a>
                <a class="nav-link active" href="/ui/manage-events"><i class="bi bi-calendar-event"></i> Manage Events</a>
                <a class="nav-link" href="/ui/events"><i class="bi bi-ticket-perforated"></i> Browse Events</a>
                <button class="btn btn-outline-light btn-sm ms-lg-2" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="page-heading d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
            <a class="back-link" href="/ui/admin"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
            <h1 class="h2 mt-2 mb-1">Manage Events</h1>
            <p class="text-muted mb-0">Create, publish and manage university events.</p>
        </div>
        <button class="btn btn-primary" onclick="openEventForm()"><i class="bi bi-plus-lg me-1"></i> Create Event</button>
    </div>

    <div id="message" class="alert d-none"></div>

    <div class="card shadow-sm mb-4" id="eventFormCard" style="display:none;">
        <div class="card-body">
            <a class="back-link mb-2" href="/ui/manage-events"><i class="bi bi-arrow-left"></i> Back to Manage Events</a>
            <h5 id="formTitle">Create New Event</h5>

            <form id="eventForm">
                <input type="hidden" id="eventId">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="eventTitle">Event Title <span class="required-mark">*</span></label>
                        <input type="text" class="form-control" id="eventTitle" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="eventCategory">Category <span class="required-mark">*</span></label>
                        <select class="form-select" id="eventCategory" required>
                            <option value="">Select category</option>
                            <option value="Academic">Academic</option>
                            <option value="Workshop">Workshop</option>
                            <option value="Conference">Conference</option>
                            <option value="Cultural">Cultural</option>
                            <option value="Sports">Sports</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="eventVenue">Venue <span class="required-mark">*</span></label>
                        <select class="form-select" id="eventVenue" required>
                            <option value="">Loading venues...</option>
                        </select>
                        <small id="venueCapacityHint" class="text-muted d-block mt-2"></small>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="startTime">Start Date &amp; Time <span class="required-mark">*</span></label>
                        <input type="datetime-local" class="form-control" id="startTime" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="endTime">End Date &amp; Time <span class="required-mark">*</span></label>
                        <input type="datetime-local" class="form-control" id="endTime" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="eventDescription">Description</label>
                        <textarea class="form-control" id="eventDescription" rows="3"></textarea>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-success" id="saveEventButton">Save as Draft</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEventForm()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="mb-3">All Events</h5>

            <div id="loading" class="text-center py-3">Loading events...</div>

            <div class="table-responsive">
                <table class="table table-hover align-middle management-table">
                    <thead>
                        <tr>
                            <th>Event</th>
                            <th>Category</th>
                            <th>Venue</th>
                            <th>Start Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="eventTable"></tbody>
                </table>
            </div>

            <p id="emptyMessage" class="text-center text-muted d-none">No events found.</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/events-manage.js"></script>
</body>
</html>
