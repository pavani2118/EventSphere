
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Events | EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=5">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/ui">EventSphere</a>
        <div>
            <a href="/ui/admin" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="/ui/manage-venues" class="btn btn-outline-light btn-sm">Venues</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Manage Events</h2>
            <p class="text-muted">Create and manage university events.</p>
        </div>
        <button class="btn btn-primary" onclick="openEventForm()">+ Create Event</button>
    </div>

    <div id="message" class="alert d-none"></div>

    <div class="card shadow-sm mb-4" id="eventFormCard" style="display:none;">
        <div class="card-body">
            <h5 id="formTitle">Create New Event</h5>

            <form id="eventForm">
                <input type="hidden" id="eventId">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Event Title</label>
                        <input type="text" class="form-control" id="eventTitle" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Category</label>
                        <select class="form-select" id="eventCategory" required>
                            <option value="">Select category</option>
                            <option value="Academic">Academic</option>
                            <option value="Workshop">Workshop</option>
                            <option value="Conference">Conference</option>
                            <option value="Cultural">Cultural</option>
                            <option value="Sports">Sports</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Venue</label>
                        <select class="form-select" id="eventVenue" required>
                            <option value="">Loading venues...</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Start Date & Time</label>
                        <input type="datetime-local" class="form-control" id="startTime" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">End Date & Time</label>
                        <input type="datetime-local" class="form-control" id="endTime" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="eventDescription" rows="3"></textarea>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-success" id="saveEventButton">Save as Draft</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEventForm()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="mb-3">All Events</h5>

            <div id="loading" class="text-center py-3">Loading events...</div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Event</th>
                            <th>Category</th>
                            <th>Venue</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="eventTable"></tbody>
                </table>
            </div>

            <p id="emptyMessage" class="text-center text-muted d-none">No events found.</p>
        </div>
    </div>
</div>

<script src="/static/js/events-manage.js"></script>
</body>
</html>
