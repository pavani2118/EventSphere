
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=10">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/ui">EventSphere</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#ticketNavbar" aria-controls="ticketNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="ticketNavbar">
            <div class="navbar-nav ms-lg-auto align-items-lg-center">
                <a class="nav-link" href="/ui/events">Browse Events</a>
                <a class="nav-link" href="/ui/my-bookings">My Bookings</a>
                <a class="nav-link active" href="/ui/my-tickets">My Tickets</a>
                <a class="nav-link" href="/ui/my-waitlist">My Waitlist</a>
                <a class="nav-link" href="/ui/notifications">Notifications</a>
                <button class="btn btn-outline-light btn-sm ms-lg-2" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>
</nav>

<main class="container py-5">
    <a class="back-link" href="/ui"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
    <h1 class="h2 mt-2 mb-2">My Bookings &amp; Tickets</h1>
    <p class="text-muted mb-4">View your bookings, payment details and ticket QR codes.</p>

    <div id="pageMessage" class="alert d-none"></div>

    <section class="mb-5">
        <h4 class="mb-3">My Bookings</h4>
        <div id="bookingLoading" class="text-muted">Loading bookings...</div>
        <div id="bookingList" class="row g-3"></div>
        <div id="noBookings" class="alert alert-light d-none">You have no bookings yet.</div>
    </section>

    <hr class="my-5">

    <section>
        <h4 class="mb-3">My Tickets</h4>
        <div id="ticketLoading" class="text-muted">Loading tickets...</div>
        <div id="ticketList" class="row g-3"></div>
        <div id="noTickets" class="alert alert-light d-none">You have no tickets yet.</div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/my-tickets.js"></script>
</body>
</html>
