<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Waitlist | EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/ui">EventSphere</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/ui/events">Browse Events</a>
            <a class="nav-link" href="/ui/my-bookings">My Bookings</a>
            <a class="nav-link" href="/ui/my-tickets">My Tickets</a>
            <a class="nav-link active" href="/ui/my-waitlist">My Waitlist</a>
            <a class="nav-link" href="/ui/notifications">Notifications</a>
            <button class="btn btn-outline-light btn-sm ms-2" id="logoutButton">Logout</button>
        </div>
    </div>
</nav>
<main class="container py-5">
    <h1 class="h2">My Waitlist</h1>
    <p class="text-muted">Track requests for events that are currently full.</p>
    <div id="pageMessage" class="alert d-none" role="alert"></div>
    <div id="loading" class="text-muted">Loading waitlist entries...</div>
    <div id="waitlistList" class="row g-3"></div>
    <div id="emptyState" class="alert alert-light d-none">
        You are not on any event waitlists.
    </div>
</main>
<script src="/static/js/my-waitlist.js"></script>
</body>
</html>
